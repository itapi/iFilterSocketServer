# socket.ikosher.me — iFilter live-session socket server.
#
# Pulled verbatim from /etc/nginx/sites-available/socket on 2026-08-19. This is
# a reference copy: nothing deploys it. Edit on the server, `nginx -t`, reload,
# then pull the result back here.
#
# Proxies to the `ifilter-socket` PM2 process on 127.0.0.1:3001, which is not
# reachable from outside — nginx terminates TLS and forwards the WebSocket
# upgrade. Two transports ride this one vhost: socket.io on /socket.io/ and the
# raw binary H.264 screen relay on /screen.
#
# The iShield instance is a SEPARATE process on 3002 behind
# ishield-socket.ikosher.me. They cannot share one: JWT_SECRET is a single
# constant per process and the two products' dashboards sign with different
# secrets.

server {
    server_name socket.ikosher.me;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/socket.ikosher.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/socket.ikosher.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = socket.ikosher.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name socket.ikosher.me;
    return 404; # managed by Certbot


}