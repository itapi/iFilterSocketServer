# ishield-socket.ikosher.me — iShield live-session socket server.
#
# Installs as sites-available/ishield-socket. Proxies to the `ishield-socket`
# PM2 process on 127.0.0.1:3002.
#
# Why a second hostname and a second process rather than a path on the existing
# one: server.js keys `sessions` and `screenSessions` on clientId alone, and
# clientId is `client_unique_id`, an int(11) drawn from each product's own
# clients table. Both sequences start at 1, so iShield client 42 and iFilter
# client 42 would share the room `session:42`, and the screen relay is a blind
# passthrough with no product check. Separately, JWT_SECRET is one constant per
# process, used both to verify admin JWTs and as the literal device token, and
# the two products sign with different secrets.
#
# On ikosher.me rather than shielder.cloud because 19 Aug settled that
# ikosher.me is the backend domain for both products while shielder.cloud is
# what a customer sees. It also puts this beside the existing socket.ikosher.me.
# Either name would have been reachable from the app: DomainFilterStore.
# ESSENTIALS carries both `ikosher.me` and `shielder.cloud` as suffix rules, so
# the device's own DNS filter permits this host in ALLOWLIST mode already.

server {
    server_name ishield-socket.ikosher.me;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Not in the iFilter vhost, and the reason it has not bitten there is
        # that socket.io sends its own ping every 25s, which keeps the
        # connection under nginx's 60s default. The /screen relay has no such
        # heartbeat — it carries H.264 frames and nothing else — so a paused or
        # backgrounded capture goes quiet and nginx closes the upgrade from
        # underneath it. Worth adding to socket.ikosher.me too.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ishield-socket.ikosher.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ishield-socket.ikosher.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = ishield-socket.ikosher.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name ishield-socket.ikosher.me;
    return 404; # managed by Certbot
}
